cat > .github/workflows/hello.yml <<'EOF'
name: Deploy Clinic Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-015d0d8ec1db7371f
  BACKEND_URL: http://clinic-backend-alb-279112709.ap-south-1.elb.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::334116998018:role/nikhil-1-2-3
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ec2-user/clinic-mngm","git fetch origin main","git reset --hard origin/main","cd backend","npm install --omit=dev","pm2 delete clinic-backend || true","pm2 start server.js --name clinic-backend","pm2 save"]' \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

      - name: Verify deployed backend
        run: |
          for i in {1..30}; do
            if curl -fsS "$BACKEND_URL/api/health"; then
              echo ""
              echo "Clinic backend deployed successfully!"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 5
          done

          echo "Backend health check failed!"
          exit 1
EOF