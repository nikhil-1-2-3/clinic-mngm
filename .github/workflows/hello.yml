name: GitHub Actions Practice

on:
  push:

jobs:
  practice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show Node version
        run: node --version

      - name: Show npm version
        run: npm --version

      - name: Show files
        run: ls -la