name: Clinic Full Application

on:
  push:
  pull_request:

jobs:
  clinic-app:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Backend
      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Start backend
        working-directory: backend
        env:
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/clinic
          JWT_SECRET: github-actions-secret
        run: |
          nohup npm start > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Check backend
        run: |
          echo "Waiting for backend..."

          for i in {1..30}; do
            if curl -f http://localhost:5000/api/health; then
              echo ""
              echo "Backend is running!"
              exit 0
            fi

            sleep 2
          done

          echo "Backend failed!"
          cat backend/backend.log
          exit 1

      # Frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5000/api
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run preview -- --host 0.0.0.0 --port 3000 > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Check frontend
        run: |
          echo "Waiting for frontend..."

          for i in {1..30}; do
            if curl -f http://localhost:3000; then
              echo ""
              echo "Frontend is running!"
              exit 0
            fi

            sleep 2
          done

          echo "Frontend failed!"
          cat frontend/frontend.log
          exit 1

      # Final verification
      - name: Verify complete application
        run: |
          echo "=============================="
          echo "MongoDB"
          echo "=============================="
          docker ps

          echo ""
          echo "=============================="
          echo "Backend"
          echo "=============================="
          curl http://localhost:5000/api/health

          echo ""
          echo "=============================="
          echo "Frontend"
          echo "=============================="
          curl -I http://localhost:3000

          echo ""
          echo "=============================="
          echo "Clinic application is running!"
          echo "=============================="