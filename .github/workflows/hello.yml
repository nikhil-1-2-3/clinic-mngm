name: Clinic CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  EC2_INSTANCE_ID: i-015d0d8ec1db7371f
  BACKEND_URL: http://clinic-backend-alb-279112709.ap-south-1.elb.amazonaws.com
  S3_BUCKET: clinic-frontend-1789645736

jobs:

  build:
    name: 1. Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build backend
        working-directory: backend
        run: |
          npm install
          node --check server.js

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist


  test:
    name: 2. Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test backend
        working-directory: backend
        run: |
          npm install
          node --check server.js

      - name: Test frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Verify frontend build
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/assets


  backend-deploy:
    name: 3. Backend Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::334116998018:role/nikhil-1-2-3
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ec2-user/clinic-mngm","git fetch origin main","git reset --hard origin/main","cd backend","npm install --omit=dev","pm2 delete clinic-backend || true","pm2 start server.js --name clinic-backend","pm2 save"]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"


  frontend-deploy:
    name: 4. Frontend Deploy
    needs: backend-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::334116998018:role/nikhil-1-2-3
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/dist/ s3://$S3_BUCKET/ --delete


  verify:
    name: 5. Verify
    needs: frontend-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify backend
        run: |
          curl -fsS "$BACKEND_URL/api/health"

      - name: Verify frontend
        run: |
          curl -fsS "http://$S3_BUCKET.s3-website.ap-south-1.amazonaws.com" > /dev/null

      - name: Deployment successful
        run: |
          echo "Clinic application deployed successfully!"